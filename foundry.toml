[profile.default]
src = "contracts"
out = "out"
libs = ["node_modules", "lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./" }]

[rpc_endpoints]
hadrian = "https://hadrian.testnet.romeprotocol.xyz/"
rubicon = "https://rubicon.mainnet.romeprotocol.xyz/"
